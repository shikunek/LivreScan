name: Deploy backend to Azure

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  # Manual run (from main): Actions -> "Deploy backend to Azure" -> Run workflow.
  workflow_dispatch:

# Never run two deployments at once; let a running one finish.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets azure/login exchange the GitHub OIDC token for Azure access

env:
  AZURE_RESOURCE_GROUP: livrescan-rg
  AZURE_WEBAPP_NAME: livrescan-backend
  # Same runtime as the App Service (PYTHON:3.12).
  PYTHON_VERSION: "3.12"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Fails the deployment early on a broken import or a bad dependency pin.
      - name: Install dependencies and check that the app imports
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -c "import app.main"

      # Same package as the manual zip deploy in backend/README.md: only the
      # source and requirements.txt. Azure installs the dependencies itself
      # (SCM_DO_BUILD_DURING_DEPLOYMENT=true), so no .venv and no .env here.
      - name: Package
        working-directory: backend
        run: zip -r ../livrescan_backend.zip app requirements.txt -x "*.pyc" -x "*/__pycache__/*"

      # Passwordless login (OIDC federated credential). Works with SCM basic
      # auth disabled on the App Service, unlike a publish profile.
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path livrescan_backend.zip \
            --type zip

      # The Free tier cold-starts slowly and Azure builds the app after the
      # upload, so give it a couple of minutes before calling it a failure.
      - name: Health check
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${AZURE_WEBAPP_NAME}.azurewebsites.net/health"
